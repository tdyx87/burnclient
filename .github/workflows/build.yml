name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    # windows-2019 was retired, which left this job stuck in "queued" forever.
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        # Let CMake pick the installed Visual Studio generator instead of
        # pinning "Visual Studio 15 2017" (not present on current images).
        run: cmake -S . -B build
      - name: Build
        run: cmake --build build --config Release
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-dll
          if-no-files-found: ignore
          path: |
            build/bin/**/*.dll
            build/bin/**/*.exe
            build/lib/**/*.dll

  build-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config libburn-dev libisofs-dev
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-so
          if-no-files-found: ignore
          path: |
            build/lib/*.so*
            build/bin/*

  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # No Homebrew packages: libburn has no Darwin backend and Homebrew has
      # no libburn/libisoburn formula. src/mac_platform.cpp uses the native
      # hdiutil/drutil tools, so only the Apple toolchain is required.
      - name: Show toolchain
        run: |
          cmake --version
          command -v hdiutil
          command -v drutil
      - name: Configure CMake
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure
